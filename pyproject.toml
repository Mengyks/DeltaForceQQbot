[project]
name = "deltaforce-qqbot"
version = "0.2.0"
description = "为《三角洲行动》玩家提供数据服务的 QQ 群机器人"
requires-python = ">=3.13,<4.0"
dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "httpx>=0.28",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "paramiko>=3.4",  # scripts/deploy_server.py 用（部署到服务器）
]
# 图片卡片渲染（v1.1）：Jinja2 模板 + Playwright 无头浏览器截图
render = [
    "jinja2>=3.1",
    "playwright>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deltaforce_bot"]

[tool.nonebot]
adapters = ["nonebot.adapters.onebot.v11"]
plugin_dirs = ["plugins"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
